apiVersion: inari.dev/v1alpha1
kind: UIHints
package: s3-backed-app
groups:
  - name: Workload
    fields: [name, namespace, image, replicas, port]
  - name: Cloud account
    fields: [providerConfigName, region]
  - name: Storage
    fields: [bucketPrefix, bucketVersioning]
  - name: IRSA
    fields: [createIrsaRole, irsaRoleArn, oidcProviderArn, oidcIssuer]
fields:
  name:
    widget: text
  namespace:
    widget: namespacePicker
  image:
    widget: imagePicker
  providerConfigName:
    widget: providerConfigPicker
    help: >-
      Name of the Crossplane ProviderConfig for the target AWS account.
      Created during AWS account onboarding.
  replicas:
    widget: number
  port:
    widget: number
  bucketPrefix:
    widget: text
    help: Optional prefix used when naming the bucket.
  region:
    widget: select
    options: [us-east-1, us-west-2, eu-west-1, eu-central-1]
  bucketVersioning:
    widget: checkbox
    help: Enable S3 object versioning.
  createIrsaRole:
    widget: checkbox
    help: >-
      Create an IAM role + bucket-scoped policy in-graph and annotate the
      workload ServiceAccount. Requires oidcProviderArn and oidcIssuer.
  irsaRoleArn:
    widget: text
    help: Existing IAM role ARN to annotate the ServiceAccount with (when not creating one).
  oidcProviderArn:
    widget: text
    help: ARN of the cluster's IAM OIDC provider (EKS IRSA).
  oidcIssuer:
    widget: text
    help: Cluster OIDC issuer hostpath, e.g. oidc.eks.eu-west-1.amazonaws.com/id/EXAMPLE.
