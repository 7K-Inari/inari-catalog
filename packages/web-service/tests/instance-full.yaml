apiVersion: kro.run/v1alpha1
kind: WebService
metadata:
  name: full
spec:
  name: full-web
  namespace: default
  image: ghcr.io/acme/app:1.0.0
  replicas: 3
  port: 3000
  host: app.example.test
  ingressClassName: nginx
  clusterIssuer: letsencrypt-staging
  externalDnsHostname: app-public.example.test
  cpuRequest: 200m
  memoryRequest: 256Mi
  cpuLimit: "1"
  memoryLimit: 1Gi
