apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: default
  labels:
    inari.dev/tenant: acme
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
