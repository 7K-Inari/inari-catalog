name: test

# Render/validation tests, dispatched on the package type declared in
# packages/<name>/package.yaml (`type`, default kro-rgd):
# - kro-rgd:      kind + kro; the generated CRD schema and composed resources
#                 are asserted by packages/<name>/tests/run.sh (Crossplane AWS
#                 APIs are stubbed via tests/deps/ CRDs).
# - policy-pack:  kind (>= 1.30); CEL ValidatingAdmissionPolicies are applied
#                 and real admission denials/allows asserted.
# - platform-app: no cluster; helm template against values-defaults.yaml.

on:
  pull_request:
    branches: [main]
    paths: ["packages/**"]
  push:
    branches: [main]
    paths: ["packages/**"]

permissions:
  contents: read

env:
  KIND_NODE_IMAGE: kindest/node:v1.31.2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rgd: ${{ steps.set.outputs.rgd }}
      policy: ${{ steps.set.outputs.policy }}
      app: ${{ steps.set.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            changed=$(git diff --name-only origin/main HEAD -- packages | cut -d/ -f2 | sort -u)
          else
            changed=$(ls packages)
          fi
          rgd='[]'; policy='[]'; app='[]'
          for p in $changed; do
            [ -f "packages/$p/package.yaml" ] || continue
            ptype=$(grep -E '^type:' "packages/$p/package.yaml" | awk '{print $2}')
            case "${ptype:-kro-rgd}" in
              kro-rgd)      rgd=$(echo "$rgd"    | jq -c --arg p "$p" '. + [$p]') ;;
              policy-pack)  policy=$(echo "$policy" | jq -c --arg p "$p" '. + [$p]') ;;
              platform-app) app=$(echo "$app"    | jq -c --arg p "$p" '. + [$p]') ;;
            esac
          done
          echo "rgd=$rgd" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  package-kro-rgd:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.rgd)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.rgd) }}
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Install kro
        run: |
          set -euo pipefail
          helm install kro oci://registry.k8s.io/kro/charts/kro \
            --namespace kro-system --create-namespace --version 0.6.1
          kubectl wait --for=condition=Available deploy/kro -n kro-system --timeout=120s

      - name: Install cert-manager (web-service dep)
        if: matrix.package == 'web-service'
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl wait --for=condition=Available deploy/cert-manager -n cert-manager --timeout=180s

      - name: Apply package dependency CRD stubs
        if: hashFiles(format('packages/{0}/tests/deps', matrix.package)) != ''
        run: |
          if [ -d "packages/${{ matrix.package }}/tests/deps" ]; then
            kubectl apply -f "packages/${{ matrix.package }}/tests/deps/"
          fi

      - name: Run render/validation tests
        run: packages/${{ matrix.package }}/tests/run.sh

  package-policy-pack:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.policy)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.policy) }}
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          node_image: ${{ env.KIND_NODE_IMAGE }}

      - name: Run admission tests
        run: packages/${{ matrix.package }}/tests/run.sh

  package-platform-app:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.app)[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.app) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Run helm render tests
        run: packages/${{ matrix.package }}/tests/run.sh
