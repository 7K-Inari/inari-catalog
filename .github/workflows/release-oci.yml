name: release-oci

# Reusable workflow: package one catalog package as an OCI artifact, push it
# to GHCR with version and channel tags, and cosign-sign it (keyless OIDC).
# Invoked ONLY from release.yml via workflow_call — never on tag pushes.

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
        description: stable | incubating

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/7k-inari/catalog

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2

      - name: Package and push OCI artifact
        id: push
        env:
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          echo "$ORAS_PASSWORD" | oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          repo="${IMAGE_PREFIX}/${{ inputs.package }}"
          # Push "." from inside the package dir: tar entries stay
          # root-relative (package.yaml, rgd.yaml, ...) — pushing the
          # directory path instead prefixes every entry with
          # "packages/<name>/" and the inari-server puller finds no files.
          digest="$(oras push "${repo}:${{ inputs.version }}" \
            --artifact-type application/vnd.inari.catalog.package.v1+yaml \
            . | tee /dev/stderr | grep -oP 'Digest: \K\S+')"
          oras tag "${repo}@${digest}" "${{ inputs.version }}" "${{ inputs.channel }}"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Cosign sign (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Cosign verify smoke check
        run: |
          cosign verify "${{ steps.push.outputs.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/"
