name: release-please

# PR-only mode: opens/updates a single Release PR with per-package version
# bumps and CHANGELOG entries. Never creates tags or GitHub Releases —
# that happens in release.yml after the Release PR is manually merged.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "scripts/sync-release-please-config.py"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        # release.yml creates the tag asynchronously on the same push; without
        # this guard, recomputing now would re-propose the just-released
        # commits with a bumped version (duplicate changelog) — the
        # version-drift loop. On the next ordinary push the tag exists and the
        # computation is correct.
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping release-please"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # release-please has no glob support for manifest components, so
      # regenerate package entries from packages/<name>/ at runtime and
      # commit them: the action reads config/manifest via the GitHub API at
      # the target branch, not from this job's working tree.
      - name: Sync package components
        id: sync
        run: |
          set -euo pipefail
          python3 scripts/sync-release-please-config.py
          if git diff --quiet -- release-please-config.json; then
            echo "config already in sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-please-config.json
          git commit -m "chore: sync release-please components from packages/"
          git push
          # This push retriggers the workflow with the synced config; skip
          # release-please now so it doesn't run against stale components.
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # RELEASE_PLEASE_TOKEN must be a GitHub App (or PAT) token: Release PRs
      # created with the default GITHUB_TOKEN do not fire push events on
      # merge, which would prevent release.yml from running.
      - if: (steps.sync.outputs.changed != 'true') && steps.gate.outputs.skip != 'true'
        uses: googleapis/release-please-action@v4
      # RELEASE_PLEASE_TOKEN must be a GitHub App (or PAT) token: Release PRs
      # created with the default GITHUB_TOKEN do not fire push events on
      # merge, which would prevent release.yml from running.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
