name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike). In manifest mode the action creates
# per-package tags (<name>-vX.Y.Z) + GitHub Releases itself; publish jobs
# then fan out per released package. There are intentionally NO tag-push
# triggers anywhere in this repo and no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      releases: ${{ steps.map.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true
          skip-github-pull-request: true
          # Release mode: create the per-package tags + GitHub Releases.
          # (PR-only mode lives in release-please.yml; skip-github-release
          # must NOT be set in the shared config file or every component is
          # "skipped from strategy config" here and nothing publishes.)
          skip-github-release: false

      # Map the action's released paths to package metadata for the matrix.
      - name: Map released paths to packages
        id: map
        if: steps.rp.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          releases="[]"
          for path in $(jq -r '.[]' <<< '${{ steps.rp.outputs.paths_released }}'); do
            name="$(basename "$path")"
            tag="$(jq -r --arg p "$path" '.[$p + "--tag_name"] // empty' <<< '${{ toJson(steps.rp.outputs) }}')"
            version="${tag##*-v}"
            channel="$(sed -n 's/^channel:[[:space:]]*//p' "$path/package.yaml" | tr -d '"'"'")"
            channel="${channel:-incubating}"
            releases="$(jq -c --arg name "$name" --arg version "$version" --arg channel "$channel" \
              '. + [{name: $name, version: $version, channel: $channel}]' <<< "$releases")"
          done
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  publish-oci:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release.outputs.releases) }}
    uses: ./.github/workflows/release-oci.yml
    secrets: inherit
    with:
      package: ${{ matrix.release.name }}
      version: ${{ matrix.release.version }}
      channel: ${{ matrix.release.channel }}

  update-catalog:
    needs: [release, publish-oci]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      INDEX_REPO: ghcr.io/7k-inari/catalog/index
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate catalog.yaml index
        run: |
          set -euo pipefail
          python3 scripts/build-catalog-index.py
          if git diff --quiet catalog.yaml; then
            echo "catalog.yaml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.yaml
          git commit -m "chore: regenerate catalog.yaml index [skip ci]"
          git push origin main

      - uses: sigstore/cosign-installer@v3

      - uses: oras-project/setup-oras@v1

      # Publish the catalog index as an OCI artifact so inari-server's
      # RegistryPuller (INARI_CATALOG_OCI_INDEX_REF) has a maintained ref.
      # oras uses the file basename as the layer title -> "catalog.yaml",
      # which is exactly the layer name the puller looks up.
      - name: Push catalog index artifact
        id: index
        env:
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$ORAS_PASSWORD" | oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          digest="$(oras push "${INDEX_REPO}:latest" \
            --artifact-type application/vnd.inari.catalog.index.v1+yaml \
            catalog.yaml | tee /dev/stderr | grep -oP 'Digest: \K\S+')"
          # Dated tag for traceability; :latest is the consumed ref.
          oras tag "${INDEX_REPO}@${digest}" "$(date -u +%Y%m%d-%H%M%S)"
          echo "ref=${INDEX_REPO}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Cosign sign index (keyless)
        run: cosign sign --yes "${{ steps.index.outputs.ref }}"
