name: release

# Releases every packages/<name> whose package.yaml version has no
# corresponding <name>-vX.Y.Z tag yet (idempotent — self-heals after a
# partially-completed release). release-please (release-please.yml) owns
# version bumps + CHANGELOGs via the Release PR; this workflow creates the
# tags + GitHub Releases itself and fans out per-package OCI publish jobs.
# (The release-please action's release mode proved unreliable here: with a
# combined Release PR it tagged every component as bare vX.Y.Z and dropped
# 13 of 14 releases as "Duplicate release tag".) There are intentionally NO
# tag-push triggers anywhere in this repo and no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.map.outputs.count }}
      releases: ${{ steps.map.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A package is released iff tag <name>-v<version from package.yaml>
      # does not exist yet.
      - name: Map untagged package versions to releases
        id: map
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          releases="[]"
          for pkg in packages/*/; do
            [ -f "$pkg/package.yaml" ] || continue
            name="$(basename "$pkg")"
            version="$(sed -n 's/^version:[[:space:]]*//p' "$pkg/package.yaml" | tr -d '"'"'")"
            [ -n "$version" ] || continue
            if git rev-parse -q --verify "refs/tags/${name}-v${version}" >/dev/null; then
              continue
            fi
            channel="$(sed -n 's/^channel:[[:space:]]*//p' "$pkg/package.yaml" | tr -d '"'"'")"
            channel="${channel:-incubating}"
            releases="$(jq -c --arg name "$name" --arg version "$version" --arg channel "$channel" \
              '. + [{name: $name, version: $version, channel: $channel}]' <<< "$releases")"
          done
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$releases")" >> "$GITHUB_OUTPUT"

      - name: Create tags + GitHub Releases
        if: steps.map.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -c '.[]' <<< '${{ steps.map.outputs.releases }}' | while read -r r; do
            name="$(jq -r .name <<< "$r")"
            version="$(jq -r .version <<< "$r")"
            tag="${name}-v${version}"
            git tag "$tag"
            git push origin "$tag"
            # Release notes: the top (just-released) CHANGELOG section.
            notes="$(awk '/^## \[/{c++} c==1' "packages/${name}/CHANGELOG.md" | sed '1d')"
            gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}"
          done

  publish-oci:
    needs: release
    if: needs.release.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release.outputs.releases) }}
    uses: ./.github/workflows/release-oci.yml
    secrets: inherit
    with:
      package: ${{ matrix.release.name }}
      version: ${{ matrix.release.version }}
      channel: ${{ matrix.release.channel }}

  update-catalog:
    needs: [release, publish-oci]
    if: needs.release.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      INDEX_REPO: ghcr.io/7k-inari/catalog/index
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate catalog.yaml index
        run: |
          set -euo pipefail
          python3 scripts/build-catalog-index.py
          if git diff --quiet catalog.yaml; then
            echo "catalog.yaml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.yaml
          git commit -m "chore: regenerate catalog.yaml index [skip ci]"
          git push origin main

      - uses: sigstore/cosign-installer@v3

      - uses: oras-project/setup-oras@v1

      # Publish the catalog index as an OCI artifact so inari-server's
      # RegistryPuller (INARI_CATALOG_OCI_INDEX_REF) has a maintained ref.
      # oras uses the file basename as the layer title -> "catalog.yaml",
      # which is exactly the layer name the puller looks up. The explicit
      # text/yaml media type matters: without it oras labels the raw YAML
      # layer as a tar and the puller tries to unpack it (and fails).
      - name: Push catalog index artifact
        id: index
        env:
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$ORAS_PASSWORD" | oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          digest="$(oras push "${INDEX_REPO}:latest" \
            --artifact-type application/vnd.inari.catalog.index.v1+yaml \
            "catalog.yaml:text/yaml" | tee /dev/stderr | grep -oP 'Digest: \K\S+')"
          # Dated tag for traceability; :latest is the consumed ref.
          oras tag "${INDEX_REPO}@${digest}" "$(date -u +%Y%m%d-%H%M%S)"
          echo "ref=${INDEX_REPO}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Cosign sign index (keyless)
        run: cosign sign --yes "${{ steps.index.outputs.ref }}"
